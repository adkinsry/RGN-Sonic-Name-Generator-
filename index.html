/* One deliberate look (16-bit zone at noon), so no light/dark split:
   every colour below is set explicitly and works on any host background. */
:root {
  color-scheme: light;
  --sky-top: #1848C8;
  --sky-mid: #4F9BFF;
  --sky-low: #BFE3FF;
  --dirt-a: #B8561E;
  --dirt-b: #7A3410;
  --grass: #45C04A;
  --navy: #0B1E5B;
  --navy-deep: #06123A;
  --gold: #FFD21F;
  --gold-dark: #C88A00;
  --red: #E3262B;
  --blue: #1F5FD6;
  --white: #FFFFFF;
  --pink: #FF7BC4;
  --ground-h: 56px;
  --rowH: clamp(40px, 7vh, 58px);
  --vis: 5;
  --display: "Titan One", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --hud: "Press Start 2P", "Courier New", monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden auto; /* scrolls only when the machine is taller than the screen */
  color: var(--white);
  font-family: var(--body);
  background: linear-gradient(var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-low) 78%);
}
/* Original Green Hill-style backdrop: checkered loop, palms, water, mountains. Anchored right so phones keep the loop. */
.zone {
  position: fixed; left: 0; bottom: calc(var(--ground-h) - 4px); z-index: 0;
  width: 100%; height: min(58vh, 470px); pointer-events: none;
}
.ground {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--ground-h);
  background:
    linear-gradient(var(--grass) 0 10px, #2E8F33 10px 14px, transparent 14px),
    repeating-conic-gradient(var(--dirt-a) 0 25%, var(--dirt-b) 0 50%) 0 14px / 28px 28px;
  z-index: 0;
}
.app {
  position: relative;
  min-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(var(--ground-h) + 10px + env(safe-area-inset-bottom, 0px));
  max-width: 1100px; margin: 0 auto;
}

/* ---------- HUD ---------- */
.hud {
  position: relative; z-index: 40;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  font-family: var(--hud); font-size: 11px; line-height: 1.9;
  text-shadow: 2px 2px 0 var(--navy-deep);
}
.hud dl { margin: 0; display: grid; grid-template-columns: auto auto; column-gap: 14px; }
.hud dt { color: var(--gold); }
.hud dd { margin: 0; color: var(--white); font-variant-numeric: tabular-nums; }
.mute {
  font: inherit; font-size: 9px; color: var(--white);
  background: var(--navy); border: 2px solid var(--gold); border-radius: 6px;
  padding: 8px 10px; cursor: pointer; text-shadow: none;
}
.mute.off { color: var(--gold); }
.hud-btns { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.mute.on { color: var(--pink); border-color: var(--pink); }
body[data-stage="start"] #modeBtn, body[data-stage="intro"] #modeBtn { visibility: hidden; }

/* ---------- After Dark mode: same machine, night palette, cheekier word pools ---------- */
body[data-mode="dark"] {
  --sky-top: #0D0526; --sky-mid: #4A1278; --sky-low: #FF4FA3;
  --grass: #2E8F5A; --dirt-a: #6B2C5C; --dirt-b: #3A1437;
  --navy: #2B0A4E; --navy-deep: #150425;
  --red: #D81B7A;
}
body[data-mode="dark"] .go { background: linear-gradient(#FF4FB0, var(--red)); box-shadow: 0 6px 0 #7A0D45, 0 10px 18px rgba(21, 4, 37, .5); }
body[data-mode="dark"] .go:active:not(:disabled) { box-shadow: 0 2px 0 #7A0D45; }
body[data-mode="dark"] .start-title { color: var(--pink); }
.start-badge {
  margin: -6px 0 0; font: 10px/1.6 var(--hud); color: var(--pink); letter-spacing: .08em;
  text-shadow: 2px 2px 0 var(--navy-deep);
}
.mode-switch {
  display: flex; border: 3px solid var(--navy-deep); border-radius: 999px; overflow: hidden;
  background: var(--navy-deep);
}
.mode-btn { font: 800 14px var(--body); color: var(--white); background: transparent; border: 0; padding: 8px 16px; cursor: pointer; }
.mode-btn.on { background: var(--gold); color: var(--navy-deep); }
body[data-mode="dark"] .mode-btn.on { background: var(--pink); color: var(--white); }
.mode-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
.age-gate {
  display: grid; gap: 10px; justify-items: center; padding: 10px 12px;
  border: 2px dashed var(--pink); border-radius: 12px;
  font: 10px/1.7 var(--hud); color: var(--pink); letter-spacing: .04em;
}
.age-gate p { margin: 0; }
.age-gate .row-btns { display: flex; gap: 10px; }

/* ---------- Machine ---------- */
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.machine {
  position: relative; width: 100%;
  display: flex; align-items: center; gap: 14px;
  box-sizing: border-box;
  padding: 26px 30px;
  background: linear-gradient(var(--navy), var(--navy-deep));
  border: 4px solid var(--gold);
  border-radius: 20px;
  box-shadow: 0 6px 0 var(--gold-dark), 0 14px 30px rgba(6, 18, 58, .45);
}
.bulbs { position: absolute; left: 18px; right: 18px; display: flex; justify-content: space-between; pointer-events: none; }
.bulbs.top { top: 8px; } .bulbs.bot { bottom: 8px; }
.bulbs i { width: 8px; height: 8px; border-radius: 50%; background: #6b5a1a; }
.machine.live .bulbs i { animation: chase .24s steps(1) infinite; }
.machine.live .bulbs i:nth-child(odd) { animation-delay: .12s; }
.machine.won .bulbs i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
@keyframes chase { 0% { background: var(--gold); box-shadow: 0 0 8px var(--gold); } 50% { background: #6b5a1a; box-shadow: none; } }

.reel-wrap { position: relative; flex: 1; min-width: 0; }
.reel-label {
  font-family: var(--hud); font-size: 9px; color: var(--gold);
  letter-spacing: .08em; margin-bottom: 8px; text-align: center;
}
.reel {
  position: relative; height: calc(var(--rowH) * var(--vis));
  overflow: hidden; border-radius: 12px;
  background: var(--navy-deep);
  perspective: 700px;
  border: 3px solid #000A2A;
}
.row {
  position: absolute; left: 0; right: 0; top: 50%;
  height: var(--rowH); margin-top: calc(var(--rowH) / -2);
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; padding-inline: 10px;
  border-block: 2px solid rgba(0, 0, 0, .28);
  backface-visibility: hidden; will-change: transform;
  font-family: var(--display); color: var(--white);
  white-space: nowrap; letter-spacing: .01em;
  -webkit-text-stroke: 1.5px var(--navy-deep); paint-order: stroke fill;
  text-shadow: 2px 2px 0 var(--navy-deep);
}
.row.c0 { background: linear-gradient(#F0474B, var(--red)); }
.row.c1 { background: linear-gradient(#3C7CF0, var(--blue)); }
.row.c2 { background: linear-gradient(#FFE15A, #F2B705); }
.reel::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(rgba(6,18,58,.85), rgba(6,18,58,0) 38%, rgba(6,18,58,0) 62%, rgba(6,18,58,.85));
}
.window {
  position: absolute; left: -3px; right: -3px; top: 50%; z-index: 3;
  height: var(--rowH); margin-top: calc(var(--rowH) / -2);
  border: 3px solid var(--gold); border-radius: 6px; box-sizing: border-box;
  box-shadow: 0 0 0 2px var(--navy-deep), 0 0 18px rgba(255, 210, 31, .55);
  pointer-events: none;
}
.flipper {
  position: absolute; right: -24px; top: 50%; z-index: 4;
  width: 26px; height: 22px; margin-top: -11px;
  transform-origin: 100% 50%;
  pointer-events: none;
}
.flipper::before {
  content: ""; position: absolute; inset: 0;
  background: var(--gold);
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
  filter: drop-shadow(0 0 0 var(--navy-deep));
}

  text-shadow: 2px 2px 0 var(--navy-deep); letter-spacing: .04em;
  animation: fadein .4s 1.2s both;
}

@keyframes slamR { from { transform: translateX(120vw) skewX(-8deg); } to { transform: translateX(0) skewX(-8deg); } }

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

#fx { position: fixed; inset: 0; z-index: 25; pointer-events: none; width: 100%; height: 100%; }

   Everything below overrides the base look: one pixel font, flat colours with hard-edged shadows,
   a banded sky, square corners, a pixelation filter on the backdrop, and chunky ring effects.
   The fan art and the hero flash are left alone: filters hid the drawings and washed out colour. It is a layer on top so it is easy to compare and to take out. */

// Every sound cue, the loudness an embedded file for it is matched to (dBFS RMS), and when it plays.
const SFX_DB = {
  start: -22,    // name entered
  type: -34,     // each typed letter of the greeting
  whoosh: -28,   // a fan-art card launches
  land: -28,     // a card lands
  ready: -20,    // "Create My Character" appears
  press: -24,    // "Create My Character" pressed
  tick: -27,     // wheel clicker
  reelStop: -26, // a reel stops
  ring: -26,     // ring burst on the reveal
  jingle: -18,   // act-clear fanfare on the reveal
  freak: -20,    // "FREAK INCOMING" alarm; a long clip (the drowning countdown) runs until the reveal
  freakReveal: -18, // the freak reveal itself (the death sting), in place of the fanfare and rings
};
const embeddedSfx = {}; // cue -> { buf, gain }, filled once audio starts
let sfxReady = Promise.resolve();
let ac = null, master = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem("ocgen-muted") === "1"; } catch (e) {}

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    sfxReady = decodeEmbedded();
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
const hz = (n) => {
  const m = /^([A-G])(#?)(\d)$/.exec(n);
  const idx = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (idx + (Number(m[3]) + 1) * 12 - 69) / 12);
};
function panner(p) {
  if (ac.createStereoPanner) { const s = ac.createStereoPanner(); s.pan.value = p; return s; }
  return ac.createGain();
}

// Wheel clicker: a short band-passed noise clack.
let lastTickAt = 0;
function tick(pan) {
  if (!ac || muted) return;
  const now = ac.currentTime;
  if (now - lastTickAt < 0.028) return;
  lastTickAt = now;
  if (embeddedSfx.tick) return playBuffer(embeddedSfx.tick, now, pan);
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 1.5;
  const g = ac.createGain();
  // Levels are measured, not guessed (see the Sound table in README.md): this puts the clack near peak 0.3.
  g.gain.setValueAtTime(1.6, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
  const p = panner(pan);
  src.connect(bp).connect(g).connect(p).connect(master);
  src.start(now, Math.random() * 0.4, 0.04);
}

// Embedded clips are level-matched to a target loudness when decoded. The built-in jingle
// measures about -18 dBFS RMS and the ring accent about -26; a typical exported clip sits
// near -14 with peaks at 1.0, so raw playback would drown the wheel clicks.
function clipGain(buf, targetDb) {
  let peak = 0, sum = 0, n = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    let a = 0, z = d.length - 1;
    while (a < z && Math.abs(d[a]) < 0.01) a++;   // trim leading and trailing silence
    while (z > a && Math.abs(d[z]) < 0.01) z--;
    for (let i = a; i <= z; i++) { const v = d[i]; sum += v * v; n++; if (Math.abs(v) > peak) peak = Math.abs(v); }
  }
  if (!n || peak === 0) return 1;
  const rms = Math.sqrt(sum / n);
  let g = Math.pow(10, targetDb / 20) / rms;
  g = Math.min(g, 0.95 / peak);                  // never let the matched clip clip
  return Math.min(20, Math.max(0.02, g));
}
function playBuffer(clip, when, pan) {
  const s = ac.createBufferSource(); s.buffer = clip.buf;
  const g = ac.createGain(); g.gain.value = clip.gain;
  s.connect(g).connect(panner(pan)).connect(master);
  s.start(when);
  return s;
}

// Ring pickup: two quick bright square-wave notes, alternating left and right.
function ring(when, pan) {
  const clip = embeddedSfx.ring;
  if (clip) return playBuffer(clip, when, pan);
  [["E6", 0, 0.07], ["B6", 0.065, 0.32]].forEach(([n, off, len]) => {
    const t = when + off;
    const o = ac.createOscillator(); o.type = "square"; o.frequency.value = hz(n);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + len);
    o.connect(lp).connect(g).connect(panner(pan)).connect(master);
    o.start(t); o.stop(t + len + 0.02);
  });
}

// An original 16-bit-style "act clear" fanfare (about 3.5 s). Not a Sega melody.
const LEAD = [["G4",1],["C5",1],["E5",1],["G5",2],["E5",1],["G5",1],["C6",3],["A5",1],["B5",1],["C6",1],["D6",1],["B5",1],["G5",1],["C6",6]];
const BASS = [["C3",2],["G2",2],["C3",2],["G2",2],["F2",2],["F2",2],["G2",2],["G2",2],["C3",6]];
const STEP = 0.155;
function voice(notes, type, vol, t0, vibratoLast) {
  let t = t0;
  notes.forEach(([n, len], i) => {
    const dur = len * STEP;
    const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(n);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.01, dur - 0.05));
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur + (i === notes.length - 1 ? 0.35 : 0.01));
    if (vibratoLast && i === notes.length - 1) {
      const lfo = ac.createOscillator(); lfo.frequency.value = 6;
      const lg = ac.createGain(); lg.gain.value = hz(n) * 0.012;
      lfo.connect(lg).connect(o.frequency); lfo.start(t + 0.15); lfo.stop(t + dur + 0.4);
    }
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4200;
    o.connect(lp).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.4);
    t += dur;
  });
}
function drum(t, kind) {
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter();
  const g = ac.createGain();
  if (kind === "k") { f.type = "lowpass"; f.frequency.value = 180; g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); }
  else if (kind === "s") { f.type = "bandpass"; f.frequency.value = 1800; g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1); }
  else { f.type = "highpass"; f.frequency.value = 5000; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9); }
  src.connect(f).connect(g).connect(master);
  src.start(t, 0, kind === "c" ? 0.95 : 0.15);
}
function jingle(t0) {
  const clip = embeddedSfx.jingle;
  if (clip) return playBuffer(clip, t0, 0);
  voice(LEAD, "square", 0.075, t0, true);
  voice(BASS, "triangle", 0.22, t0, false);
  for (let i = 0; i < 16; i += 2) { drum(t0 + i * STEP, "k"); drum(t0 + (i + 1) * STEP, "s"); }
  drum(t0 + 14.5 * STEP, "s");
  drum(t0 + 16 * STEP, "k"); drum(t0 + 16 * STEP, "c");
}

// Embedded files arrive as data: URIs; decode them once and level-match them.
function dataUriToBuffer(uri) {
  const bin = atob(uri.slice(uri.indexOf(",") + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function decodeEmbedded() {
  await Promise.all(Object.entries(EMBEDDED.sounds).map(async ([cue, uri]) => {
    if (uri === null) return; // silenced cue
    try {
      const buf = await ac.decodeAudioData(dataUriToBuffer(uri));
      embeddedSfx[cue] = { buf, gain: clipGain(buf, SFX_DB[cue] ?? -24) };
    } catch (e) { console.warn(`embedded sound "${cue}" could not be decoded`, e); }
  }));
  document.documentElement.dataset.sfx = Object.keys(embeddedSfx).sort().join(" ");
  document.documentElement.dataset.sfxSilent = Object.keys(EMBEDDED.sounds).filter((c) => EMBEDDED.sounds[c] === null).sort().join(" ");
}

function sweep(type, f0, f1, dur, vol, t, pan) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g).connect(panner(pan)).connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(type, f0, f1, dur, vol, t, pan, swell) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.Q.value = type === "bandpass" ? 1.2 : 0.7;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  if (swell) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.45); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
  else { g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); }
  s.connect(f).connect(g).connect(panner(pan)).connect(master);
  s.start(t, Math.random() * Math.max(0, 0.47 - dur), dur + 0.02);
}
// Original placeholder sounds for the cues that had none. Not level-measured yet (see README).
const BUILTIN_SFX = {
  start: (t, p) => { sweep("square", 260, 1040, 0.16, 0.09, t, p); sweep("square", 520, 1560, 0.16, 0.05, t + 0.09, p); },
  type: (t, p) => sweep("square", 1500, 1300, 0.025, 0.03, t, p),

  // Keep animating while anything moves, then stop so an idle page costs nothing.
  // "holding" also stops here: showReveal() kicks the loop again.
  if (reelsIdle && !rings.length && !critters.length) { running = false; return; }
  requestAnimationFrame(frame);
}

go.addEventListener("click", () => {
  if (phase === "warning" || phase === "spinning" || phase === "holding") return;
  spin();
});
document.addEventListener("keydown", (e) => {
  if (stage !== "main") return;
  if (e.key === " " && e.target === document.body) { e.preventDefault(); go.click(); }
  else if (e.key === "Escape" && phase === "revealed") { clearReveal(); phase = "idle"; }
});

/* ================= Sound controls ================= */

  muteBtn.textContent = muted ? "SOUND: OFF" : "SOUND: ON";

}
muteBtn.addEventListener("click", () => {
  muted = !muted;
  try { localStorage.setItem("ocgen-muted", muted ? "1" : "0"); } catch (e) {}

syncMute();

modeClassic.addEventListener("click", () => { ageGate.hidden = true; setMode("classic"); });

/* ================= Start screen and intro ================= */
// Placeholder fan art: original goofy critters drawn here, not Sega characters. Real pieces go in
// assets/fanart/ (with the artist's permission) and replace these entirely; see README.
const DOODLES = [
  { bg: "#FFF3C4", body: "#3C7CF0", belly: "#FFD9A8", shoe: "#E3262B", caption: "my OC Brenda DONT STEAL!!",
    extra: '<path d="M30 20l4 8 8 1-6 6 2 8-8-4-7 4 2-8-6-6 8-1z" fill="#FFD21F" stroke="#111" stroke-width="2"/>' },
  { bg: "#E6F7E1", body: "#7B3FD0", belly: "#F2D6FF", shoe: "#FFD21F", caption: "ULTRA DARK Todd (edgy)",
    extra: '<rect x="50" y="38" width="30" height="9" rx="3" fill="#111"/><path d="M50 42h-6" stroke="#111" stroke-width="3"/>' },
  { bg: "#FFE4EC", body: "#FF8A1F", belly: "#FFF0D0", shoe: "#1F5FD6", caption: "Gary the Snail but FAST",
    extra: '<circle cx="34" cy="40" r="13" fill="#C88A00" stroke="#111" stroke-width="2.5"/><path d="M34 40m-6 0a6 6 0 1 0 12 0a3 3 0 1 0-6 0" fill="none" stroke="#111" stroke-width="2"/>' },
  { bg: "#E2F0FF", body: "#2EB872", belly: "#DFFFE9", shoe: "#FF4A4F", caption: "Kevin the Shrimp + chili dog",
    extra: '<rect x="70" y="62" width="24" height="10" rx="5" fill="#E8B060" stroke="#111" stroke-width="2"/><path d="M73 65h18" stroke="#B5361B" stroke-width="4" stroke-linecap="round"/>' },
  { bg: "#F4EAFF", body: "#E3262B", belly: "#FFE3D0", shoe: "#111111", caption: "Nevaeh the Bobbit Worm <3",
    extra: '<path d="M48 22l6-10 6 10 6-10 6 10v6H48z" fill="#FFD21F" stroke="#111" stroke-width="2"/>' },
  { bg: "#FFF8E0", body: "#F2B705", belly: "#FFFFFF", shoe: "#2E9E43", caption: "Rhonda (shes faster than u)",
    extra: '<path d="M84 30l4-6M88 40l7-2M84 50l5 4" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>' },
];
function doodleSvg(d, i) {
  const look = [[3, -2], [-2, 2], [2, 3], [-3, -1], [1, -3], [-2, -2]][i % 6];
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="${d.bg}"/>
    <path d="M4 42h16M2 54h20M6 66h14" stroke="#8FA3C8" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 30L16 20 40 42 8 46 40 56 16 72 52 64z" fill="${d.body}" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M44 72l-4 10M66 72l4 10" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="57" cy="50" rx="25" ry="23" fill="${d.body}" stroke="#111" stroke-width="2.5"/>
    <ellipse cx="68" cy="60" rx="13" ry="9" fill="${d.belly}" stroke="#111" stroke-width="2"/>
    <path d="M62 64q6 5 12 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="58" cy="42" r="8" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="72" cy="43" r="6.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="${58 + look[0]}" cy="${42 + look[1]}" r="3.4" fill="#111"/><circle cx="${72 - look[1]}" cy="${43 + look[0]}" r="2.8" fill="#111"/>
    <ellipse cx="38" cy="85" rx="14" ry="6.5" fill="${d.shoe}" stroke="#111" stroke-width="2.5"/>
    <ellipse cx="72" cy="86" rx="14" ry="6.5" fill="${d.shoe}" stroke="#111" stroke-width="2.5"/>
    <path d="M30 83h12M64 84h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    ${d.extra}</svg>`;
}
// Up to six pieces, picked at random when there are more. A piece flagged "hero" in credits.json
// is always included and always last: it lands big in the centre and closes the intro.
const HERO = EMBEDDED.fanart.find((p) => p.hero) || null;
function fanArtPieces() {
  if (EMBEDDED.fanart.length) {
    const all = EMBEDDED.fanart.filter((p) => p !== HERO);
    for (let i = all.length - 1; i > 0; i--) { const j = rand(i + 1); [all[i], all[j]] = [all[j], all[i]]; }
    return HERO ? [...all.slice(0, 5), HERO] : all.slice(0, 6);
  }
  return DOODLES.map((d, i) => ({ svg: doodleSvg(d, i), caption: d.caption }));
}

const startEl = document.getElementById("start");
const startForm = document.getElementById("startForm");
const nameInput = document.getElementById("nameInput");
const startErr = document.getElementById("startErr");
const introEl = document.getElementById("intro");
const introCards = document.getElementById("introCards");
const introCenter = document.getElementById("introCenter");
const introText = document.getElementById("introText");
const introSr = document.getElementById("introSr");
const createBtn = document.getElementById("createBtn");
const introBg = document.getElementById("introBg");

const CHAR_MS = 55, LINE_PAUSE_MS = 450;            // greeting typing speed
// Fan-art cards launch one at a time: each finishes its flight before the next one leaves the centre.
const CARD_FIRST_MS = 300, CARD_FLIGHT_MS = 950, CARD_GAP_MS = CARD_FLIGHT_MS + 100;
const HERO_FLIGHT_MS = 1200, HERO_LINGER_MS = 2000; // the hero's slower arrival and its pause before the end
let introTimers = [], introAnims = [], introDone = false, cardEls = [], heroEl = null;
const later = (ms, fn) => introTimers.push(setTimeout(fn, ms));

function setStage(s) { stage = s; document.body.dataset.stage = s; }

// Pick up to n non-overlapping card spots that keep clear of the greeting, the HUD and the ground.
// Cards shrink until they all fit; on a very small screen fewer cards appear.
function cardSpots(n, extraKeep = []) {
  const W = innerWidth, H = innerHeight;
  const c = introCenter.getBoundingClientRect();
  const hud = document.querySelector(".hud").getBoundingClientRect();
  const pad = 12, top = hud.bottom + 8, bottom = H - 56 - 8;
  const keeps = [c, ...extraKeep].map((k) => ({ l: k.left - pad, t: k.top - pad, r: k.right + pad, b: k.bottom + pad }));
  const hit = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
  for (let w = Math.min(210, Math.max(84, Math.min(W, H) * 0.26)); w >= 56; w *= 0.88) {
    const h = Math.round(w * 1.2), step = Math.max(10, w / 5), cands = [];
    for (let y = top; y + h <= bottom; y += step)
      for (let x = 8; x + w <= W - 8; x += step) {
        const r = { l: x, t: y, r: x + w, b: y + h };
        if (!keeps.some((k) => hit(r, k))) cands.push(r);
      }
    let chosen = [];
    for (let attempt = 0; attempt < 12 && chosen.length < n; attempt++) { // greedy picks are random; retry a few
    const tryPick = [];
    while (tryPick.length < n) {
      let best = null, bestScore = -1;
      for (const r of cands) {
        const grown = { l: r.l - pad, t: r.t - pad, r: r.r + pad, b: r.b + pad };
        if (tryPick.some((q) => hit(grown, q))) continue;
        const cx = (r.l + r.r) / 2, cy = (r.t + r.b) / 2;
        const d = tryPick.length ? Math.min(...tryPick.map((q) => Math.hypot(cx - (q.l + q.r) / 2, cy - (q.t + q.b) / 2))) : 1e6;
        const score = d + Math.random() * w * 0.4;
        if (score > bestScore) { bestScore = score; best = r; }
      }
      if (!best) break;
      tryPick.push(best);
    }
    if (tryPick.length > chosen.length) chosen = tryPick;
    }
    if (chosen.length === n || w * 0.88 < 56) return { w, h, spots: chosen };
  }
  return { w: 56, h: 67, spots: [] };
}

// The hero card: as big as fits in the centre of the frame, clear of the HUD and the ground.
function heroRect() {
  const W = innerWidth, H = innerHeight;
  const top = document.querySelector(".hud").getBoundingClientRect().bottom + 8, bottom = H - 56 - 8;
  const w = Math.max(140, Math.min(360, W * 0.62, ((bottom - top) * 0.8) / 1.2));
  const h = Math.round(w * 1.2);
  const t = Math.max(top, Math.min(bottom - h, H / 2 - h / 2));
  return { left: (W - w) / 2, top: t, right: (W + w) / 2, bottom: t + h, width: w, height: h };
}

function buildCards() {
  introCards.textContent = "";
  heroEl = null;
  cardEls = fanArtPieces().map((piece) => {
    const fig = document.createElement("figure");
    fig.className = "fan-card";
    if (piece.hero) { fig.classList.add("hero"); heroEl = fig; }
    if (piece.svg) fig.innerHTML = piece.svg; // our own static markup
    else { const img = document.createElement("img"); img.src = piece.src; img.alt = ""; fig.appendChild(img); }
    if (piece.caption || piece.credit) {
      const cap = document.createElement("figcaption");
      cap.textContent = piece.caption || "";
      if (piece.credit) { const cr = document.createElement("span"); cr.className = "credit"; cr.textContent = piece.credit; cap.appendChild(cr); }
      fig.appendChild(cap);
    }
    fig.dataset.tilt = (piece.hero ? Math.random() * 6 - 3 : Math.random() * 14 - 7).toFixed(1);
    introCards.appendChild(fig);
    return fig;
  });
}

// Size and park every card at its spot. Cards that do not fit are hidden.
function layoutCards() {
  const others = cardEls.filter((el) => el !== heroEl);
  const hero = heroEl ? heroRect() : null;
  const { w, h, spots } = cardSpots(others.length, hero ? [hero] : []);
  others.forEach((el, i) => {
    const r = spots[i];
    el.hidden = !r;
    if (!r) return;
    el.style.width = w + "px"; el.style.height = h + "px";
    el.classList.toggle("tiny", w < 90); // too small for a readable caption
    el.style.transform = `translate(${r.l}px, ${r.t}px) rotate(${el.dataset.tilt}deg)`;
  });
  if (heroEl) {
    heroEl.hidden = false;
    heroEl.style.width = hero.width + "px"; heroEl.style.height = hero.height + "px";
    heroEl.style.setProperty("--hx", hero.left + "px"); heroEl.style.setProperty("--hy", hero.top + "px");
    heroEl.style.transform = `translate(${hero.left}px, ${hero.top}px) rotate(${heroEl.dataset.tilt}deg)`;
  }
  return { w, h, spots, hero };
}

function typeGreeting(name) {
  const parts = [
    { text: "Hey " }, { text: name, cls: "nm" }, { text: ", let's see your best Sonic fan art!" },
    { text: "Are you ready to meet your character?", line2: true },
  ];
  introText.textContent = "";
  let l2 = null;
  const slots = parts.map((p) => {
    const wrap = document.createElement("span");
    if (p.cls) wrap.className = p.cls;
    const shown = document.createElement("span"), pend = document.createElement("span");
    pend.className = "pend"; pend.textContent = p.text;
    wrap.append(shown, pend);
    if (p.line2) { l2 = l2 || introText.appendChild(Object.assign(document.createElement("span"), { className: "l2" })); l2.appendChild(wrap); }
    else introText.appendChild(wrap);
    return { shown, pend, line2: p.line2 };
  });
  introSr.textContent = parts.slice(0, 3).map((p) => p.text).join("") + " " + parts[3].text;
  let t = 0, n = 0;
  slots.forEach((sl, i) => {
    if (sl.line2 && !slots[i - 1].line2) t += LINE_PAUSE_MS;
    for (let k = 0; k < sl.pend.textContent.length; k++) {
      t += CHAR_MS;
      later(t, () => {
        const ch = sl.pend.textContent[0];
        sl.pend.textContent = sl.pend.textContent.slice(1);
        sl.shown.textContent += ch;
        if (ch !== " " && n++ % 2 === 0) sfx("type");
      });
    }
  });
  return { slots, end: t };
}

// From a tiny spinning card at the centre of the screen to its parked spot.
function cardKeyframes(el, w, h) {
  if (reduceMotion) return [{ opacity: 0 }, { opacity: 1 }];
  const from = `translate(${innerWidth / 2 - w / 2}px, ${innerHeight / 2 - h / 2}px)`;
  return [
    { transform: `${from} rotate(${+el.dataset.tilt - 540}deg) scale(0.12)`, opacity: 0 },
    { opacity: 1, offset: 0.1 },
    { transform: el.style.transform },
  ];
}

let laidOutAt = { w: 0, h: 0 }; // viewport size the card spots were chosen for

function runIntro(name) {
  setStage("intro");
  introDone = false;
  createBtn.classList.remove("show");
  introBg.classList.remove("show");
  const greeting = typeGreeting(name);
  buildCards();
  const { w, h, spots, hero } = layoutCards();
  laidOutAt = { w: innerWidth, h: innerHeight };
  let lastLand = 0;
  cardEls.filter((el) => el !== heroEl).forEach((el, i) => {
    const r = spots[i];
    if (!r) return;
    const delay = CARD_FIRST_MS + i * CARD_GAP_MS;
    el._anim = el.animate(cardKeyframes(el, w, h), {
      duration: reduceMotion ? 300 : CARD_FLIGHT_MS, delay, fill: "backwards",
      easing: "cubic-bezier(.3, .6, .35, 1.06)",
    });
    introAnims.push(el._anim);
    const pan = Math.max(-0.7, Math.min(0.7, ((r.l + w / 2) / innerWidth) * 2 - 1));
    later(delay, () => sfx("whoosh", pan));
    later(delay + CARD_FLIGHT_MS * 0.9, () => sfx("land", pan));
    lastLand = delay + CARD_FLIGHT_MS;
  });
  let end = Math.max(greeting.end, lastLand) + 200;
  if (heroEl) {
    // The hero waits for the others, spins up big in the centre, then holds before the finish.
    const delay = Math.max(lastLand + 100, CARD_FIRST_MS);
    heroEl._anim = heroEl.animate(cardKeyframes(heroEl, hero.width, hero.height), {
      duration: reduceMotion ? 300 : HERO_FLIGHT_MS, delay, fill: "backwards",
      easing: "cubic-bezier(.3, .6, .35, 1.06)",
    });
    introAnims.push(heroEl._anim);
    later(delay, () => sfx("whoosh", 0));
    later(delay + HERO_FLIGHT_MS * 0.9, () => sfx("land", 0));
    end = Math.max(greeting.end + 200, delay + HERO_FLIGHT_MS + HERO_LINGER_MS);
  }
  later(end, finishIntro);
  introEl._slots = greeting.slots;
}

// Ends the intro, early if the viewer presses Enter, Space or taps.
function finishIntro() {
  if (introDone) return;
  introDone = true;
  introTimers.forEach(clearTimeout); introTimers = [];
  introAnims.forEach((a) => a.finish()); introAnims = [];
  (introEl._slots || []).forEach((sl) => { sl.shown.textContent += sl.pend.textContent; sl.pend.textContent = ""; });
  if (heroEl) { // the hero dissolves into a full-screen flash behind the greeting
    introBg.style.backgroundImage = `url("${HERO.src}")`;
    introBg.classList.add("show");
    heroEl.classList.add("away");
  }
  createBtn.classList.add("show");
  sfx("ready");
  createBtn.focus({ preventScroll: true });
}

startForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (stage !== "start") return;
  const name = nameInput.value.replace(/\s+/g, " ").trim().slice(0, 20);
  if (!name) {
    startErr.textContent = "Type your name first!";
    const card = startForm;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    nameInput.focus();
    return;
  }
  startErr.textContent = "";
  audio();
  sfxReady.then(() => sfx("start")); // the opening theme starts once the name is in
  startEl.hidden = true;
  introEl.hidden = false;
  // On a phone the keyboard is still open here. Closing it resizes the viewport a moment later,
  // so the cards are laid out only once that has settled; otherwise they would get spots on the
  // keyboard-shortened screen and every resize used to end their flight early.
  nameInput.blur();
  afterViewportSettles(() => runIntro(name));
});
function afterViewportSettles(fn) {
  const touch = window.matchMedia("(hover: none)").matches; // a soft keyboard may be closing
  let timer = 0, done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(timer); removeEventListener("resize", bump); fn(); };
  const bump = () => { clearTimeout(timer); timer = setTimeout(finish, 150); };
  addEventListener("resize", bump);
  timer = setTimeout(finish, touch ? 500 : 0);
}
document.addEventListener("keydown", (e) => {
  if (stage === "intro" && !introDone && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); finishIntro(); }
});
introEl.addEventListener("click", (e) => { if (!introDone && e.target !== createBtn) finishIntro(); });
createBtn.addEventListener("click", () => {
  if (stage !== "intro" || !introDone) return;
  sfx("press");
  setStage("main");
  introEl.classList.add("leaving");
  setTimeout(() => { introEl.hidden = true; introEl.classList.remove("leaving"); introCards.textContent = ""; cardEls = []; }, 350);
  spin();
});
// A real resize mid-intro re-targets the cards: landed ones move, flying ones steer to new spots.
let introResizeTimer = 0;
window.addEventListener("resize", () => {
  if (stage !== "intro" || !cardEls.length) return;
  clearTimeout(introResizeTimer);
  introResizeTimer = setTimeout(() => {
    if (innerWidth === laidOutAt.w && innerHeight === laidOutAt.h) return;
    laidOutAt = { w: innerWidth, h: innerHeight };
    const { w, h } = layoutCards();
    cardEls.forEach((el) => {
      const a = el._anim;
      if (!a || a.playState === "finished" || el.hidden) return;
      if (typeof a.effect.setKeyframes === "function") a.effect.setKeyframes(cardKeyframes(el, w, h));
      else a.finish();
    });
  }, 150);
});
// Press Start is the first user gesture, which is the earliest a phone will let audio play. It
// unlocks audio with a short click and brings in the name card; the opening theme waits for the
// name. The name box is focused only where there is a mouse: on a phone that would open the
// keyboard over the card before the player has seen it.
const hasPointer = window.matchMedia("(hover: hover)").matches;
const pressStart = document.getElementById("pressStart");
pressStart.addEventListener("click", () => {
  if (stage !== "start" || !startForm.hidden) return;
  audio();
  sfxReady.then(() => { if (stage === "start") sfx("press"); });
  pressStart.hidden = true;
  startForm.hidden = false;
  startForm.classList.add("in");
  if (hasPointer) nameInput.focus({ preventScroll: true });
});
if (hasPointer) pressStart.focus({ preventScroll: true });

// Next Player: back to the name card with a fresh score, keeping the mode and the sound on.
nextBtn.addEventListener("click", () => {
  if (stage !== "main" || phase === "warning" || phase === "spinning" || phase === "holding") return;
  sfx("press");
  clearReveal();
  phase = "idle"; result = null;
  score = 0; ringTotal = 0;
  hudScore.textContent = "0"; hudRings.textContent = "0"; hudTime.textContent = "0:00";
  machine.classList.remove("won", "live");
  go.textContent = "Make a Character";
  copyBtn.hidden = true; shareBtn.hidden = true; nextBtn.hidden = true;
  reelName.setIdle(); reelAnimal.setIdle();
  announce.textContent = "Next player";
  nameInput.value = ""; startErr.textContent = ""; ageGate.hidden = true;
  setStage("start");
  startEl.hidden = false;
  pressStart.hidden = true;
  startForm.hidden = false;
  startForm.classList.remove("in"); void startForm.offsetWidth; startForm.classList.add("in");
  if (hasPointer) nameInput.focus({ preventScroll: true });
});

/* ================= Boot ================= */
reelName.setIdle(); reelAnimal.setIdle();
resize();
window.addEventListener("resize", () => {
  resize();
  if (phase === "revealed") { fitLine(rvName); fitLine(rvAnimal); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (phase === "idle") { reelName.setIdle(); reelAnimal.setIdle(); } resize(); });
})();
</script>
